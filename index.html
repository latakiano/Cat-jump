<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Himalaya Cat: Cave Chronicles</title>
    <style>
        :root { --gold: #FFD700; --red: #ff3333; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        
        #overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .window { 
            background: #050510; padding: 25px; border-radius: 30px; border: 2px solid var(--gold); text-align: center;
            width: 85%; max-width: 450px; box-shadow: 0 0 50px rgba(0,0,0,1);
        }
        .shop-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0;
            max-height: 150px; overflow-y: auto; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 15px;
        }
        .card { background: #111; padding: 10px; border-radius: 12px; border: 1px solid #333; cursor: pointer; font-size: 10px; }
        .card.active { border: 2px solid var(--gold); box-shadow: 0 0 15px var(--gold); }

        .btn-start { 
            background: var(--gold); color: #000; padding: 15px 50px; border-radius: 50px; 
            border: none; font-size: 22px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        #hud { 
            position: fixed; top: 15px; width: 100%; display: flex; justify-content: space-around;
            z-index: 500; font-weight: bold; color: var(--gold); text-shadow: 2px 2px #000;
        }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="hud">
    <div>💰 <span id="c-val">0</span></div>
    <div>📍 المرحلة <span id="s-val">1</span></div>
    <div>📏 <span id="d-val">0</span>m</div>
</div>

<div id="overlay">
    <div class="window">
        <h2 style="color:var(--gold); margin:0;" id="title">مغامرة الكهف المظلم</h2>
        <div class="shop-grid" id="shop"></div>
        <div style="border: 1px dashed var(--red); padding: 10px; border-radius: 15px;">
            <p style="margin:0; font-size:12px;">🏥 تبرع 1$ لإنقاذ أرواح القطط</p>
            <button onclick="sfx(200,'sawtooth',0.3); alert('شكراً يا بطل! ❤️')" style="background:var(--red); border:none; color:white; padding:5px 15px; border-radius:10px; cursor:pointer; margin-top:5px;">تبرع</button>
        </div>
    </div>
    <button class="btn-start" onclick="init()">ابدأ الآن 🚀</button>
</div>

<canvas id="c"></canvas>

<script>
const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
const ov = document.getElementById('overlay'), shp = document.getElementById('shop'), ttl = document.getElementById('title');

const imgC = new Image(); imgC.src = 'https://cdn-icons-png.flaticon.com/512/1864/1864514.png';
const imgM = new Image(); imgM.src = 'https://cdn-icons-png.flaticon.com/512/1211/1211053.png';
const imgG = new Image(); imgG.src = 'https://cdn-icons-png.flaticon.com/512/2489/2489756.png';

let active = false, stage = 1, coins = 0, dist = 0, frame = 0;
let obs = [], gold = [];
let p = { x: 0, y: 0, v: 0, g: 0.45, j: -9, w: 65, h: 55 };

const audio = new (window.AudioContext || window.webkitAudioContext)();
function sfx(f, t, d) {
    if(audio.state === 'suspended') audio.resume();
    let o = audio.createOscillator(), g = audio.createGain();
    o.type = t; o.frequency.setValueAtTime(f, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + d);
    o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
}

function resize() {
    cvs.width = window.innerWidth; cvs.height = window.innerHeight;
    p.x = cvs.width * 0.15;
}
window.onresize = resize; resize();

for(let i=1; i<=20; i++) {
    shp.innerHTML += `<div class="card ${i==1?'active':''}" id="m${i}" onclick="sel(${i})">متجر ${i}<br>$0.99</div>`;
}
function sel(n) { stage = n; document.querySelectorAll('.card').forEach(c => c.classList.remove('active')); document.getElementById('m'+n).classList.add('active'); sfx(400, 'sine', 0.1); }

function init() {
    active = true; dist = 0; obs = []; gold = []; frame = 0;
    p.y = cvs.height / 2; p.v = 0;
    ov.style.display = 'none';
    sfx(150, 'square', 0.4);
    loop();
}

function loop() {
    if(!active) return;
    frame++; dist += 1.5;
    document.getElementById('d-val').innerText = Math.floor(dist/10);
    document.getElementById('s-val').innerText = stage;
    document.getElementById('c-val').innerText = coins;

    // رسم الكهف (تأثير الصخور)
    ctx.fillStyle = '#050510'; ctx.fillRect(0,0,cvs.width, cvs.height);
    
    let wallH = (cvs.height * 0.18) + Math.sin(frame*0.03) * 40;
    ctx.fillStyle = `hsla(${stage*40}, 60%, 10%, 1)`;
    // الجدران مع تأثير "خشن"
    for(let x=0; x<cvs.width; x+=20) {
        let hNoise = Math.sin(x + frame*0.1) * 10;
        ctx.fillRect(x, 0, 21, wallH + hNoise);
        ctx.fillRect(x, cvs.height - (wallH + hNoise), 21, wallH + hNoise);
    }

    // القطة
    p.v += p.g; p.y += p.v;
    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h/2);
    ctx.scale(-1, 1);
    ctx.rotate(p.v * 0.02); // إمالة القطة عند السقوط
    ctx.drawImage(imgC, -p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();

    // العملات
    if(frame % 90 == 0) gold.push({x: cvs.width, y: wallH + 50 + Math.random()*(cvs.height - wallH*2 - 100)});
    gold.forEach((g, i) => {
        g.x -= 5;
        let hover = Math.sin(frame*0.1) * 5;
        ctx.drawImage(imgG, g.x, g.y + hover, 35, 35);
        if(Math.hypot(p.x+30-g.x, p.y+25-(g.y+hover)) < 40) { gold.splice(i,1); coins++; sfx(800, 'sine', 0.1); }
    });

    // الوحوش (حركة نابضة)
    if(frame > 100 && frame % Math.max(35, 100 - stage*4) == 0) {
        obs.push({x: cvs.width, y: wallH + Math.random()*(cvs.height - wallH*2 - 80), s: 70});
    }
    obs.forEach((o, i) => {
        o.x -= (6 + stage*0.5);
        let pulse = Math.sin(frame*0.2) * 10;
        ctx.drawImage(imgM, o.x, o.y, o.s + pulse, o.s + pulse);
        if(p.x+15 < o.x+o.s-15 && p.x+p.w-15 > o.x+15 && p.y+15 < o.y+o.s-15 && p.y+p.h-15 > o.y+15) end(false);
        if(o.x < -100) obs.splice(i, 1);
    });

    if(p.y < wallH - 10 || p.y > cvs.height - wallH - p.h + 10) end(false);
    if(dist > 3000) end(true);

    requestAnimationFrame(loop);
}

function end(win) {
    active = false;
    sfx(win ? 1000 : 80, win ? 'square' : 'sawtooth', 0.5);
    ttl.innerText = win ? "🏆 المرحلة اكتملت!" : "💀 الدهليز ابتلعك!";
    ttl.style.color = win ? "var(--gold)" : "var(--red)";
    ov.style.display = 'flex';
}

const j = (e) => { if(active) { p.v = p.j; sfx(600, 'triangle', 0.1); } if(e) e.preventDefault(); };
window.onmousedown = j; window.ontouchstart = j;
</script>
</body>
</html>
