<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Himalaya Cat: Ultra Pro</title>
    <style>
        :root { --gold: #FFD700; --red: #ff3e3e; --cyan: #00f2ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
        
        /* واجهة المستخدم */
        #ui-layer { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); transition: 0.5s; }
        .panel { background: linear-gradient(145deg, #1a1a2e, #050505); padding: 30px; border-radius: 30px; border: 2px solid var(--gold); text-align: center; width: 80%; max-width: 400px; box-shadow: 0 0 50px rgba(255, 215, 0, 0.2); }
        .btn-play { background: var(--gold); color: #000; padding: 15px 40px; border-radius: 50px; border: none; font-size: 22px; font-weight: bold; cursor: pointer; margin-top: 20px; text-transform: uppercase; }
        
        /* شريط المعلومات */
        #hud { position: fixed; top: 0; left: 0; width: 100%; height: 50px; display: flex; align-items: center; justify-content: space-around; color: var(--gold); z-index: 500; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); font-weight: bold; pointer-events: none; }
        canvas { display: block; image-rendering: crisp-edges; }
    </style>
</head>
<body>

<div id="hud">
    <div>💰 <span id="coins">0</span></div>
    <div>🦇 <span id="stage">1</span></div>
    <div>📏 <span id="dist">0</span>m</div>
</div>

<div id="ui-layer">
    <div class="panel">
        <h1 id="title" style="color:var(--gold); margin:0;">دهليز الهيمالايا</h1>
        <p id="desc">مرحلة جديدة، خطر أكبر!</p>
        <button class="btn-play" onclick="start()">ابدأ الآن</button>
    </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const ui = document.getElementById('ui-layer'), title = document.getElementById('title'), desc = document.getElementById('desc');

// الموارد (Images)
const img = {
    cat: new Image(),
    monster: new Image(),
    coin: new Image()
};
img.cat.src = 'https://cdn-icons-png.flaticon.com/512/1864/1864514.png';
img.monster.src = 'https://cdn-icons-png.flaticon.com/512/1211/1211053.png';
img.coin.src = 'https://cdn-icons-png.flaticon.com/512/2489/2489756.png';

let state = { active: false, stage: 1, coins: 0, dist: 0, frame: 0 };
let world = { obstacles: [], gold: [], stars: [], wallH: 0 };
let p = { x: 0, y: 0, v: 0, g: 0.5, j: -9, w: 70, h: 60 };

function init() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    p.x = canvas.width * 0.15;
    world.stars = Array.from({length: 100}, () => ({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*2}));
}
window.onresize = init; init();

function start() {
    ui.style.display = 'none';
    state.active = true; state.dist = 0; state.frame = 0;
    world.obstacles = []; world.gold = [];
    p.y = canvas.height / 2; p.v = 0;
    requestAnimationFrame(loop);
}

function die() {
    state.active = false;
    title.innerText = "انتهت الرحلة!";
    desc.innerText = `وصلت إلى ${Math.floor(state.dist)} متر وجمعت ${state.coins} عملة.`;
    ui.style.display = 'flex';
}

function winStage() {
    state.active = false;
    state.stage++;
    title.innerText = `تم اجتياز المرحلة ${state.stage - 1}`;
    desc.innerText = "استعد للدهليز القادم، الوحوش أسرع!";
    document.getElementById('stage').innerText = state.stage;
    ui.style.display = 'flex';
}

// التحكم
const jump = (e) => { if(state.active) p.v = p.j; if(e) e.preventDefault(); };
window.addEventListener('mousedown', jump);
window.addEventListener('touchstart', jump, {passive: false});

function loop() {
    if(!state.active) return;
    state.frame++; state.dist += 0.5;
    document.getElementById('dist').innerText = Math.floor(state.dist);

    // الخلفية
    ctx.fillStyle = '#050510'; ctx.fillRect(0,0,canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    world.stars.forEach(s => { s.x -= 0.5; if(s.x < 0) s.x = canvas.width; ctx.fillRect(s.x, s.y, s.r, s.r); });

    // الدهاليز (الجدران)
    world.wallH = (canvas.height * 0.15) + Math.sin(state.frame * 0.02) * 30;
    let hue = (state.stage * 50) % 360;
    ctx.fillStyle = `hsla(${hue}, 70%, 10%, 0.8)`;
    ctx.fillRect(0, 0, canvas.width, world.wallH);
    ctx.fillRect(0, canvas.height - world.wallH, canvas.width, world.wallH);

    // القطة (محسنة الحركة)
    p.v += p.g; p.y += p.v;
    ctx.save();
    ctx.translate(p.x + p.w/2, p.y + p.h/2);
    ctx.scale(-1, 1); // تعديل الاتجاه
    ctx.rotate(p.v * 0.03); // إمالة القطة حسب القفزة
    ctx.drawImage(img.cat, -p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();

    // الكوينز
    if(state.frame % 100 == 0) world.gold.push({x: canvas.width, y: world.wallH + Math.random()*(canvas.height - 2*world.wallH - 40)});
    world.gold.forEach((g, i) => {
        g.x -= 5; ctx.drawImage(img.coin, g.x, g.y, 35, 35);
        if(Math.hypot(p.x + p.w/2 - (g.x+17), p.y + p.h/2 - (g.y+17)) < 40) {
            world.gold.splice(i,1); state.coins++;
            document.getElementById('coins').innerText = state.coins;
        }
    });

    // الوحوش
    if(state.frame > 50 && state.frame % Math.max(40, 100 - state.stage*5) == 0) {
        world.obstacles.push({x: canvas.width, y: world.wallH + Math.random()*(canvas.height - 2*world.wallH - 60), s: 70});
    }
    world.obstacles.forEach((o, i) => {
        o.x -= (6 + state.stage * 0.5);
        ctx.drawImage(img.monster, o.x, o.y, o.s, o.s);
        // تصادم دقيق
        if(p.x+10 < o.x+o.s-10 && p.x+p.w-10 > o.x+10 && p.y+10 < o.y+o.s-10 && p.y+p.h-10 > o.y+10) die();
        if(o.x < -100) world.obstacles.splice(i,1);
    });

    // القوانين
    if(p.y < world.wallH - 10 || p.y > canvas.height - world.wallH - p.h + 10) die();
    if(state.dist > 1000) winStage();

    requestAnimationFrame(loop);
}
</script>
</body>
</html>
